[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoo_calrissian_runner"
dynamic = ["version"]
description = 'Python library for bridging ZOO-Project execution context and calrissian'
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache License (2.0)"}
keywords = []
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
    "zoo-runner-common",
    "zoo-template-common",
    "pycalrissian>=0.8.3",
    "eoap-cwlwrap>=0.31.0",
    "cwl-utils>=0.14",
    "attrs",
    "loguru",
    "setuptools",
    "kubernetes>=35.0.0",
    "cwltool",
    "zoo-framework"
]

[project.urls]
Homepage = "https://github.com/ZOO-Project/zoo-calrissian-runner"
Documentation = "https://zoo-project.github.io/zoo-calrissian-runner/"
Issues = "https://github.com/ZOO-Project/zoo-calrissian-runner/issues"
Source = "https://github.com/ZOO-Project/zoo-calrissian-runner"
Changelog = "https://github.com/ZOO-Project/zoo-calrissian-runner/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "zoo_calrissian_runner/__about__.py"


[tool.hatch.metadata]
allow-direct-references = true


[tool.coverage.run]
source_pkgs = ["zoo_calrissian_runner", "tests"]
branch = true
parallel = true
omit = [
  "zoo_calrissian_runner/__about__.py",
]

[tool.coverage.paths]
zoo_calrissian_runner = ["zoo_calrissian_runner"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.default.env-vars]
PIP_EXTRA_INDEX_URL = "https://test.pypi.org/simple/"

[tool.hatch.envs.default]
skip-install = false
dependencies = [
    "zoo-runner-common",
    "pycalrissian>=0.8.3",
    "eoap-cwlwrap>=0.31.0",
    "cwl-utils>=0.14",
    "cwl-loader>=0.28.0",
    "attrs",
    "loguru",
    "setuptools",
    "kubernetes==35.0.0",
    "cwltool",
    "zoo-framework",
]


[tool.hatch.envs.test]
skip-install = false

dependencies = [
    "pytest",
    "coverage",
    "pycalrissian>=0.8.3",
    "eoap-cwlwrap>=0.31.0",
    "cwl-loader>=0.28.0",
    "cwl-utils>=0.14",
    "attrs",
    "loguru",
    "setuptools",
    "kubernetes==35.0.0",
    "cwltool",
    "zoo-framework",
    "python-dotenv"
]

[tool.hatch.envs.test.env-vars]
PIP_EXTRA_INDEX_URL = "https://test.pypi.org/simple/"
RETRY_ATTEMPTS="0"

[tool.hatch.envs.test.scripts]
test = ["_pin-cwl-loader-fork", "_pin-pycalrissian-fix", "pytest {args}"]
testv = ["_pin-cwl-loader-fork", "_pin-pycalrissian-fix", "pytest -v {args}"]
cov = ["_pin-cwl-loader-fork", "_pin-pycalrissian-fix", "coverage run --source=zoo_calrissian_runner -m pytest {args}", "coverage report"]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.envs.docs]
skip-install = false

dependencies = [
  "pdocs",
  "mkdocs-material",
  "mkdocs-jupyter"
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"
