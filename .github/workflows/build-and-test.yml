# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build and Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10.15"]
    name: install pyenv
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # python -m pip install --upgrade pip
        sudo apt-get update -qy
        sudo apt-get install -y pipx
        pipx install hatch
        pipx install ruff

    - name: Ruff Check
      run: ruff check .

    - name: Ruff Format Check
      run: ruff format --check .

    - name: Cache Hatch
      id: cache-hatch
      uses: actions/cache@v3
      with:
        path: /home/runner/.local/share/hatch/env/virtual/
        key: ${{ runner.os }}-hatch
    - name: Build
      run: hatch build
     # Install Minikube
    - name: Install Minikube
      run: |
        sudo apt-get install -y apt-transport-https
        sudo curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        sudo install minikube-linux-amd64 /usr/local/bin/minikube
    # Start Minikube
    - name: Start Minikube
      run: |
        minikube start --driver=docker --kubernetes-version v1.28.0
    # Set and export KUBECONFIG path
    - name: Set Envs and paths
      run: |
        cp ~/.kube/config ~/.kube/kubeconfig-t2-dev.yaml
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
        py3_path=$(which python3)
        echo "HATCH_PYTHON_PATH=$py3_path" >> $GITHUB_ENV
    # Deploy an S3-compatible endpoint (LocalStack) in-cluster: the
    # integration tests stage results out to S3 (see tests/.env), and
    # tests/conftest.py points AWS_SERVICE_URL at this Service.
    - name: Set up Helm
      uses: azure/setup-helm@v4
    # LocalStack requires a LOCALSTACK_AUTH_TOKEN (ZOO-Project has a free
    # open-source license for it). The token itself never lives in this
    # repo: it's stored as the repository secret LOCALSTACK_AUTH_TOKEN
    # (Settings > Secrets and variables > Actions) and only materialized
    # here as a Kubernetes Secret, which localstack-values.yaml pulls in
    # via envFrom. See docs/localstack.md for how to set/rotate it.
    - name: Create LocalStack auth secret
      run: |
        kubectl create namespace eoap-zoo-project --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic localstack-auth \
          --namespace eoap-zoo-project \
          --from-literal=LOCALSTACK_AUTH_TOKEN="${{ secrets.LOCALSTACK_AUTH_TOKEN }}" \
          --dry-run=client -o yaml | kubectl apply -f -
    - name: Deploy LocalStack (S3)
      run: |
        helm repo add localstack https://helm.localstack.cloud
        helm repo update
        helm install eoap-zoo-project-localstack localstack/localstack \
          --version 0.7.0 \
          --namespace eoap-zoo-project --create-namespace \
          --values .github/ci/localstack-values.yaml \
          --wait --timeout 5m
    - name: Run Tests with Hatch
      run: |
        #hatch run test.py310:cov
        hatch -e test run pytest
